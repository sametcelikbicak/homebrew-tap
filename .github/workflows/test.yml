name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: ruby syntax
        run: ruby -c Formula/vidfix.rb

      - name: brew style
        run: brew style Formula/

      - name: brew audit
        if: github.event_name == 'push'
        run: |
          brew tap sametcelikbicak/tap https://github.com/sametcelikbicak/homebrew-tap
          brew audit --strict --skip-style sametcelikbicak/tap/vidfix
